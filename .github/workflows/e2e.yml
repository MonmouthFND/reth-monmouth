name: E2E Tests

on:
  push:
    branches: [main, develop]
    paths:
      - 'wallet-sdk/**'
      - '.github/workflows/e2e.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'wallet-sdk/**'
      - '.github/workflows/e2e.yml'
  workflow_dispatch:
    inputs:
      debug_enabled:
        type: boolean
        description: 'Run with debug logging'
        required: false
        default: false

env:
  CI: true
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '0'

jobs:
  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: wallet-sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: wallet-sdk/package-lock.json

      - name: Install Foundry (Anvil)
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Verify Anvil installation
        run: anvil --version

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build SDK
        run: npm run build

      - name: Build test app
        run: npm run build:app

      - name: Run unit tests first
        run: npm test
        continue-on-error: true

      - name: Start Anvil in background
        run: |
          anvil --port 8545 --chain-id 31337 --accounts 10 --balance 10000 &
          echo "Waiting for Anvil to start..."
          sleep 5
          curl -s -X POST -H "Content-Type: application/json" \
            --data '{"jsonrpc":"2.0","method":"eth_blockNumber","params":[],"id":1}' \
            http://127.0.0.1:8545
        env:
          E2E_SKIP_ANVIL: 'true'

      - name: Run E2E tests
        run: npm run test:e2e
        env:
          E2E_SKIP_ANVIL: 'true'
          DEBUG: ${{ inputs.debug_enabled && 'pw:api' || '' }}

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: wallet-sdk/e2e/reports/
          retention-days: 7

      - name: Upload test screenshots
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-screenshots
          path: wallet-sdk/e2e/test-results/
          retention-days: 7

      - name: Upload trace files
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: wallet-sdk/e2e/test-results/**/*.zip
          retention-days: 7

  e2e-tests-headed:
    name: E2E Tests (Headed - Manual)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'workflow_dispatch'

    defaults:
      run:
        working-directory: wallet-sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: wallet-sdk/package-lock.json

      - name: Install Foundry (Anvil)
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build SDK
        run: npm run build

      - name: Build test app
        run: npm run build:app

      - name: Start Anvil in background
        run: |
          anvil --port 8545 --chain-id 31337 --accounts 10 --balance 10000 &
          sleep 5
        env:
          E2E_SKIP_ANVIL: 'true'

      - name: Run E2E tests with video
        run: npx playwright test --video=on
        env:
          E2E_SKIP_ANVIL: 'true'

      - name: Upload videos
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-videos
          path: wallet-sdk/e2e/test-results/**/*.webm
          retention-days: 7
