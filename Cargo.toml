[workspace]
members = [
    "node",
    "chain-config",
    "evm",
    "txpool",
    "engine",
    "exex-host",
    "primitives",
    "tests",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
homepage = "https://github.com/monmouth/monmouth-node"
repository = "https://github.com/monmouth/monmouth-node"

[workspace.dependencies]
# reth
reth = { git = "https://github.com/paradigmxyz/reth", tag = "v1.8.1" }
reth-primitives = { git = "https://github.com/paradigmxyz/reth", tag = "v1.8.1" }
reth-ethereum-primitives = { git = "https://github.com/paradigmxyz/reth", tag = "v1.8.1" }
reth-ethereum-engine-primitives = { git = "https://github.com/paradigmxyz/reth", tag = "v1.8.1" }
reth-node-types = { git = "https://github.com/paradigmxyz/reth", tag = "v1.8.1" }
reth-rpc-eth-api = { git = "https://github.com/paradigmxyz/reth", tag = "v1.8.1" }
reth-rpc-convert = { git = "https://github.com/paradigmxyz/reth", tag = "v1.8.1" }
reth-provider = { git = "https://github.com/paradigmxyz/reth", tag = "v1.8.1" }
reth-tracing = { git = "https://github.com/paradigmxyz/reth", tag = "v1.8.1" }
reth-e2e-test-utils = { git = "https://github.com/paradigmxyz/reth", tag = "v1.8.1" }
reth-primitives-traits = { git = "https://github.com/paradigmxyz/reth", tag = "v1.8.1" }
reth-evm = { git = "https://github.com/paradigmxyz/reth", tag = "v1.8.1" }
reth-evm-ethereum = { git = "https://github.com/paradigmxyz/reth", tag = "v1.8.1" }
reth-cli-util = { git = "https://github.com/paradigmxyz/reth", tag = "v1.8.1" }
reth-ethereum-cli = { git = "https://github.com/paradigmxyz/reth", tag = "v1.8.1" }
reth-exex = { git = "https://github.com/paradigmxyz/reth", tag = "v1.8.1" }
reth-db = { git = "https://github.com/paradigmxyz/reth", tag = "v1.8.1" }
reth-testing-utils = { git = "https://github.com/paradigmxyz/reth", tag = "v1.8.1" }
reth-db-common = { git = "https://github.com/paradigmxyz/reth", tag = "v1.8.1" }
reth-chainspec = { git = "https://github.com/paradigmxyz/reth", tag = "v1.8.1" }
reth-consensus = { git = "https://github.com/paradigmxyz/reth", tag = "v1.8.1" }
reth-node-api = { git = "https://github.com/paradigmxyz/reth", tag = "v1.8.1" }
reth-node-builder = { git = "https://github.com/paradigmxyz/reth", tag = "v1.8.1" }
reth-node-core = { git = "https://github.com/paradigmxyz/reth", tag = "v1.8.1" }
reth-node-ethereum = { git = "https://github.com/paradigmxyz/reth", tag = "v1.8.1" }
reth-payload-builder = { git = "https://github.com/paradigmxyz/reth", tag = "v1.8.1" }
reth-payload-primitives = { git = "https://github.com/paradigmxyz/reth", tag = "v1.8.1" }
reth-revm = { git = "https://github.com/paradigmxyz/reth", tag = "v1.8.1" }
reth-rpc = { git = "https://github.com/paradigmxyz/reth", tag = "v1.8.1" }
reth-rpc-api = { git = "https://github.com/paradigmxyz/reth", tag = "v1.8.1" }
reth-rpc-builder = { git = "https://github.com/paradigmxyz/reth", tag = "v1.8.1" }
reth-rpc-engine-api = { git = "https://github.com/paradigmxyz/reth", tag = "v1.8.1" }
reth-rpc-eth-types = { git = "https://github.com/paradigmxyz/reth", tag = "v1.8.1" }
reth-rpc-server-types = { git = "https://github.com/paradigmxyz/reth", tag = "v1.8.1" }
reth-tasks = { git = "https://github.com/paradigmxyz/reth", tag = "v1.8.1" }
reth-transaction-pool = { git = "https://github.com/paradigmxyz/reth", tag = "v1.8.1" }
reth-trie = { git = "https://github.com/paradigmxyz/reth", tag = "v1.8.1" }

# alloy
alloy-primitives = { version = "1.3.1", default-features = false, features = [
    "map-foldhash",
] }
alloy-genesis = { version = "1.0.35", default-features = false }
alloy-eips = { version = "1.0.35", default-features = false }
alloy-rpc-types = { version = "1.0.35", default-features = false }
alloy-rpc-types-engine = { version = "1.0.35", default-features = false }
alloy-rpc-types-eth = { version = "1.0.35" }
alloy-consensus = { version = "1.0.35" }
alloy-trie = { version = "0.9.1", default-features = false }
alloy-provider = { version = "1.0.35" }
alloy-hardforks = "0.3.5"
alloy-rpc-client = { version = "1.0.35" }
alloy-chains = "0.1"
alloy-rlp = "0.3"
alloy-sol-types = "1.3.1"

# revm
revm = { version = "29.0.0", default-features = false }
revm-bytecode = { version = "6.2.2", default-features = false }
revm-primitives = { version = "10", default-features = false }

# op-alloy
op-alloy-rpc-types = { version = "0.20.0", default-features = false }
op-alloy-rpc-types-engine = { version = "0.20.0", default-features = false }
op-alloy-rpc-jsonrpsee = { version = "0.20.0", default-features = false }
op-alloy-network = { version = "0.20.0", default-features = false }
op-alloy-consensus = { version = "0.20.0", default-features = false }

# tokio
tokio = { version = "1.44.2", features = ["full"] }
tokio-stream = "0.1.11"
tokio-tungstenite = { version = "0.26.2", features = ["native-tls"] }

# async
futures = "0.3"
futures-util = "0.3"
reqwest = { version = "0.12", features = ["json", "stream"] }

# rpc
jsonrpsee = "0.26.0"
jsonrpsee-types = "0.26.0"

# gRPC & protobuf
tonic = "0.12"
prost = "0.13"
tonic-build = "0.12"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"

# Error handling
eyre = { version = "0.6.12" }
thiserror = "1.0"

# Logging & metrics
tracing = { version = "0.1.41" }
tracing-subscriber = "0.3"
metrics = "0.24.1"
metrics-derive = "0.1"

# Utils
once_cell = "1.19"
parking_lot = "0.12"
clap = { version = "4.4.3" }
bytes = "1.5"
hex = "0.4"
async-trait = "0.1"
url = "2.5"
itertools = "0.14"
uuid = { version = "1.6.1", features = ["serde", "v5", "v4"] }
time = { version = "0.3.36", features = ["macros", "formatting", "parsing"] }
chrono = "0.4.41"
brotli = "8.0.1"
arc-swap = "1.7.1"
rand = "0.9.2"
rustls = "0.23.23"

# Internal dependencies
monmouth-primitives = { path = "primitives" }
monmouth-chain-config = { path = "chain-config" }
monmouth-evm = { path = "evm" }
monmouth-txpool = { path = "txpool" }
monmouth-engine = { path = "engine" }
monmouth-exex-host = { path = "exex-host" }
monmouth-node = { path = "node" }

[workspace.lints]

[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"

[profile.release]
opt-level = 3
lto = "thin"
debug = "none"
strip = "symbols"
panic = "unwind"
codegen-units = 16

[profile.maxperf]
inherits = "release"
lto = "fat"
codegen-units = 1